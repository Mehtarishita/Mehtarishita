<svg width="1000" height="250" viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glows -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7b2fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05040f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05040f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#ff2e9f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05040f" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Moving Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#FF2E9F;#B14EFF;#00E5FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FF2E9F">
        <animate attributeName="stop-color" values="#FF2E9F;#B14EFF;#00E5FF;#FF2E9F" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#B14EFF">
        <animate attributeName="stop-color" values="#B14EFF;#00E5FF;#FF2E9F;#B14EFF" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Diagonal Grid Pattern with moving animation -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <animate attributeName="y" values="0;40" dur="4s" repeatCount="indefinite" />
      <line x1="0" y1="0" x2="0" y2="40" stroke="#3a3660" stroke-width="1.5" stroke-opacity="0.3"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#3a3660" stroke-width="1.5" stroke-opacity="0.3"/>
    </pattern>

    <!-- Fade mask for grid -->
    <linearGradient id="gridFade" x1="0" y1="100%" x2="0" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="0" y="100" width="1000" height="150" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1000" height="250" fill="#05040f"/>
  
  <!-- Grid -->
  <rect x="0" y="100" width="1000" height="150" fill="url(#grid)" mask="url(#gridMask)"/>
  
  <!-- Glowing Orbs -->
  <rect width="1000" height="250" fill="url(#glowPurple)"/>
  <rect width="1000" height="250" fill="url(#glowTeal)"/>
  <rect width="1000" height="250" fill="url(#glowPink)"/>

  <!-- Twinkling Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="40" r="1.5" opacity="0.8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="90" r="1" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="180" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="30" r="1" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="200" r="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Orbital Animation in Top Right -->
  <g transform="translate(850, 70) rotate(-15)">
    <!-- Orbit Path -->
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.3"/>
    
    <!-- Moving Dot (Glow) -->
    <circle r="5" fill="#00e5ff" filter="blur(2px)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 60,0 A 60,20 0 1,0 -60,0 A 60,20 0 1,0 60,0"/>
    </circle>
    <!-- Moving Dot (Core) -->
    <circle r="2.5" fill="#ffffff">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 60,0 A 60,20 0 1,0 -60,0 A 60,20 0 1,0 60,0"/>
    </circle>
  </g>

  <!-- Main Text Glow -->
  <text x="500" y="115" font-family="'Inter', 'Segoe UI', 'Arial', sans-serif" font-size="68" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="6" filter="url(#glow)">
    RISHITA MEHTA
  </text>
  <!-- Main Text Core -->
  <text x="500" y="115" font-family="'Inter', 'Segoe UI', 'Arial', sans-serif" font-size="68" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="6">
    RISHITA MEHTA
  </text>

  <!-- Subtext -->
  <text x="500" y="155" font-family="'Inter', 'Segoe UI', 'Arial', sans-serif" font-size="16" fill="#c7c4e8" text-anchor="middle" letter-spacing="1">
    Aspiring Software Engineer • Full Stack Developer • AI/ML Enthusiast
  </text>

  <!-- Badges -->
  <g transform="translate(305, 190)">
    <!-- Published Patent Badge -->
    <g>
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#05040f" fill-opacity="0.5" stroke="#B14EFF" stroke-width="1.5"/>
      <text x="75" y="21" font-family="'Inter', 'Segoe UI', 'Arial', sans-serif" font-size="12" font-weight="bold" fill="#c7c4e8" text-anchor="middle">Published Patent</text>
    </g>
    <!-- SIH 2025 Badge -->
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#05040f" fill-opacity="0.5" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="110" y="21" font-family="'Inter', 'Segoe UI', 'Arial', sans-serif" font-size="12" font-weight="bold" fill="#c7c4e8" text-anchor="middle">SIH 2025 • National Runner-Up</text>
    </g>
  </g>
</svg>
